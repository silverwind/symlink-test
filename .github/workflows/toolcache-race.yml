name: toolcache-race

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/toolcache-race.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Before
        run: ls /opt/hostedtoolcache/go
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: After
        run: |
          go version
          command -v go
          go env GOROOT
