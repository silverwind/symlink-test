{
  "name": "probe-coercion",
  "on": {
    "push": {
      "branches": [
        "matrix-names"
      ]
    }
  },
  "jobs": {
    "coerce": {
      "name": "${{ format('coerce:{0}:{1}:{2}', toJSON(matrix.v), matrix.zero || '-', matrix.one || '-') }}",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": [
            null,
            0,
            false,
            "",
            "0",
            "false",
            1,
            true,
            "1",
            "01",
            "1.0",
            "true",
            "abc"
          ],
          "include": [
            {
              "v": 0,
              "zero": "z"
            },
            {
              "v": 1,
              "one": "o"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "string_numbers": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": [
            "1"
          ],
          "include": [
            {
              "v": "01",
              "extra": "leading"
            },
            {
              "v": "1.0",
              "extra": "decimal"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    }
  }
}
