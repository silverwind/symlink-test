name: log-commands
on:
  workflow_dispatch:
  push:
    branches: [log-commands]

jobs:
  runner-written:
    runs-on: ubuntu-latest
    steps:
      - name: control - step emitted
        run: echo "::error::step-emitted pct%25here bracket%5Dhere nl%0Ahere"

      - name: runner error via failed command processing
        continue-on-error: true
        run: echo "::add-matcher::/tmp/no%25such%5Dmatcher.json"

      - name: runner error via nonzero exit
        continue-on-error: true
        run: exit 1

  bad-action-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: runner error via unresolvable action
        continue-on-error: true
        uses: ./no%25such%5Ddir
