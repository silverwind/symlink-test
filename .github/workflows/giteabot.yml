name: giteabot

on:
  workflow_run:
    workflows:
      - giteabot-review
    types:
      - requested

permissions: {}

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_run' && format('review-{0}', github.event.workflow_run.head_sha) || 'maintenance') }}
  cancel-in-progress: false

jobs:
  giteabot:
    if: github.repository == 'silverwind/symlink-test' && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request_review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - env:
          SECRET: ${{ secrets.RELAY_TEST_SECRET }}
        run: test -n "$SECRET" && echo "secret available, group review-${{ github.event.workflow_run.head_sha }}"
      - uses: go-gitea/giteabot@f48c6a15e0d384f037aea19cc05ff5e9551096b9 # v1.1.0
        with:
          github_token: ${{ github.token }}
          checks: lgtm
