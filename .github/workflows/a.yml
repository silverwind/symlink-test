name: a
on: push
jobs:
  objects:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant:
          - {target: basic, tag_suffix: "", platforms: "linux/amd64,linux/arm64"}
          - {target: dind, tag_suffix: "-dind", platforms: linux/amd64}
    steps:
      - run: "true"
  order:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zeta: [z]
        alpha: [a]
        mid: [m]
    steps:
      - run: "true"
  types:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {str: s, int: 1, float: 3.10, bool: true, boolf: false, empty: "", neg: -2.5, big: 12345678901234567890}
    steps:
      - run: "true"
  nested:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu]
        cfg:
          - {b: 2, a: 1, deep: {y: yy, x: xx}, list: [l1, l2]}
    steps:
      - run: "true"
  arrays:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        list: [[p, q], [r]]
    steps:
      - run: "true"
  includeonly:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {zz: first, aa: second}
    steps:
      - run: "true"
  includeextra:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [a, b]
        include:
          - {os: a, extra: e}
          - {os: c, other: o}
    steps:
      - run: "true"
  interp:
    name: interp ${{ matrix.variant }} ${{ matrix.variant.target }} ${{ matrix.list }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [{target: t1}]
        list: [[x, y]]
    steps:
      - run: "true"
  empties:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        obj: [{}]
        arr: [[]]
        str: [""]
    steps:
      - run: "true"
