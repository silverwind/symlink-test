name: label-events
run-name: ${{ github.event.action }} ${{ github.event.label.name }}
on:
  pull_request:
    types: [labeled, unlabeled]
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - run: echo "$ACTION $LABEL"
        env:
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
