{
  "name": "probe-empty",
  "on": {
    "push": {
      "branches": [
        "matrix-names"
      ]
    }
  },
  "jobs": {
    "excluded": {
      "name": "${{ format('empty:{0}:index={1}:total={2}', toJSON(matrix), strategy.job-index, strategy.job-total) }}",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": [
            "a"
          ],
          "exclude": [
            {
              "v": "a"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "padded": {
      "name": "  kept  ",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": [
            "a"
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "embedded_literal": {
      "name": "pre-${{ 'fixed' }}",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": [
            "a"
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    }
  }
}
