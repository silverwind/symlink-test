{
  "name": "probe-matching",
  "on": {
    "push": {
      "branches": [
        "matrix-names"
      ]
    }
  },
  "jobs": {
    "key_case": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "os": [
            "a"
          ],
          "include": [
            {
              "OS": "b",
              "extra": "x"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "value_case": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "os": [
            "a"
          ],
          "include": [
            {
              "os": "A",
              "extra": "x"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "type_match": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": [
            1
          ],
          "include": [
            {
              "v": 1,
              "extra": "float"
            },
            {
              "v": "1",
              "extra": "string"
            },
            {
              "v": true,
              "extra": "boolean"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "object_order": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "cfg": [
            {
              "a": 1,
              "b": 2
            }
          ],
          "include": [
            {
              "cfg": {
                "b": 2,
                "a": 1
              },
              "extra": "reordered"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "object_partial": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "cfg": [
            {
              "a": 1,
              "b": 2
            }
          ],
          "include": [
            {
              "cfg": {
                "a": 1
              },
              "extra": "partial"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "object_value_case": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "cfg": [
            {
              "a": "red"
            }
          ],
          "include": [
            {
              "cfg": {
                "a": "RED"
              },
              "extra": "case"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "object_key_case": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "cfg": [
            {
              "a": "red"
            }
          ],
          "include": [
            {
              "cfg": {
                "A": "red"
              },
              "extra": "case"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "excluded_readd": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "os": [
            "a",
            "b"
          ],
          "exclude": [
            {
              "os": "a"
            }
          ],
          "include": [
            {
              "os": "a",
              "extra": "x"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "excluded_all": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "os": [
            "a"
          ],
          "exclude": [
            {
              "os": "a"
            }
          ],
          "include": [
            {
              "extra": "x"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "overwrite": {
      "name": "${{ format('overwrite:{0}:{1}', matrix.os, matrix.extra) }}",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "os": [
            "a"
          ],
          "include": [
            {
              "os": "a",
              "extra": "first"
            },
            {
              "os": "a",
              "extra": "last"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "include_twice": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "os": [
            "a"
          ],
          "include": [
            {
              "os": "b",
              "extra": "first"
            },
            {
              "os": "b",
              "extra": "last"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    }
  }
}
