name: gai-stall

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I gai_threads.py 120 concurrent
      - run: python3 -I gai_threads.py 60 sequential
