name: bool-probe-cast
on:
  workflow_dispatch:
    inputs:
      noval:
        description: boolean default no
        type: boolean
        default: no
      offval:
        description: boolean default off
        type: boolean
        default: off
      falseval:
        description: boolean default false
        type: boolean
        default: false
      banana:
        description: boolean default banana
        type: boolean
        default: banana
      zero:
        description: boolean default 0
        type: boolean
        default: 0
      one:
        description: boolean default 1
        type: boolean
        default: 1
      empty:
        description: boolean default empty string
        type: boolean
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: dump contexts
        env:
          INPUTS: ${{ toJSON(inputs) }}
          EVENT_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          echo "INPUTS=$INPUTS"
          echo "EVENT_INPUTS=$EVENT_INPUTS"
