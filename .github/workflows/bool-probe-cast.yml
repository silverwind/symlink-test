name: bool-probe-cast
on:
  workflow_dispatch:
    inputs:
      noval:
        type: boolean
        default: no
      offval:
        type: boolean
        default: off
      falsecap:
        type: boolean
        default: False
      yescap:
        type: boolean
        default: Yes
      oncaps:
        type: boolean
        default: ON

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: dump contexts
        env:
          INPUTS: ${{ toJSON(inputs) }}
          EVENT_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          echo "INPUTS=$INPUTS"
          echo "EVENT_INPUTS=$EVENT_INPUTS"
