name: pnpm-store-probe

on:
  push:
  workflow_dispatch:

jobs:
  vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          echo "uid=$(id -u) HOME=$HOME GITHUB_WORKSPACE=$GITHUB_WORKSPACE RUNNER_TEMP=$RUNNER_TEMP"
          for p in / "$HOME" "$GITHUB_WORKSPACE" "$(dirname "$(dirname "$GITHUB_WORKSPACE")")" "$RUNNER_TEMP"; do echo "$p -> $(findmnt -n -o TARGET,SOURCE,FSTYPE -T "$p")"; done
          npx -y pnpm@12.4.1 store path
          npx -y pnpm@12.4.1 install
          grep storeDir node_modules/.modules.yaml
          ls -a node_modules
  container:
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - uses: actions/checkout@v6
      - run: |
          echo "uid=$(id -u) HOME=$HOME GITHUB_WORKSPACE=$GITHUB_WORKSPACE RUNNER_TEMP=$RUNNER_TEMP"
          for p in / "$HOME" "$GITHUB_WORKSPACE" "$(dirname "$(dirname "$GITHUB_WORKSPACE")")" "$RUNNER_TEMP"; do echo "$p -> $(findmnt -n -o TARGET,SOURCE,FSTYPE -T "$p")"; done
          npx -y pnpm@12.4.1 store path
          npx -y pnpm@12.4.1 install
          grep storeDir node_modules/.modules.yaml
          ls -a node_modules
