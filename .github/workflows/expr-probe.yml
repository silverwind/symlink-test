name: expr-probe

on:
  push:
    branches: [expr-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      FOO: from-upper
    steps:
      - uses: actions/checkout@v4

      - name: expression probes
        env:
          # ENGINE DISCRIMINATOR: legacy Expressions2 prints -0, new GitHub.Actions.Expressions prints 0
          P01_negzero_format: ${{ format('{0}', -0) }}
          P02_negzero_bare: ${{ -0 }}
          P03_negzero_dot: ${{ format('{0}', -0.0) }}
          P04_negzero_tojson: ${{ toJSON(-0) }}

          # number formatting
          P10_1e15: ${{ format('{0}', 1000000000000000) }}
          P11_2p53: ${{ format('{0}', 9007199254740993) }}
          P12_precision: ${{ format('{0}', 0.84551240822557006) }}
          P13_1e18: ${{ format('{0}', 1000000000000000000) }}
          P14_small: ${{ format('{0}', 0.00001) }}

          # ordinal casing
          P20_longs: ${{ 's' == 'ſ' }}
          P21_deseret: ${{ '𐐀' == '𐐨' }}
          P22_dotless: ${{ 'i' == 'ı' }}
          P23_eszett: ${{ 'ß' == 'ẞ' }}
          P24_sigma: ${{ 'ς' == 'Σ' }}
          P25_kelvin: ${{ 'k' == 'K' }}

          # string to number coercion
          P30_infinity_lower: ${{ 'infinity' == Infinity }}
          P31_infinity_plus: ${{ '+Infinity' == Infinity }}
          P32_infinity_exact: ${{ 'Infinity' == Infinity }}

          # precedence
          P40_precedence: ${{ 1 < 2 == true }}
          P41_chain: ${{ 3 < 2 < 1 }}

          # env context case sensitivity, FOO is set at job level
          P50_env_exact: ${{ env.FOO }}
          P51_env_lower: ${{ env.foo }}
          P52_env_mixed: ${{ env.Foo }}

          # fromJSON argument coercion
          P60_fromjson_bool: ${{ fromJSON(true) }}
          P61_fromjson_num: ${{ fromJSON('-0') }}

          # object key order
          P70_tojson_order: ${{ toJSON(fromJSON('{"b":1,"a":2,"*":3}')) }}
          P71_wildcard_order: ${{ join(fromJSON('{"one":"1","two":"2","*":"star"}').*, ',') }}

          # case-colliding keys, GitHub keeps first casing and last value
          P80_case_collide: ${{ toJSON(fromJSON('{"a":1,"A":2}')) }}
          P81_case_collide_read: ${{ fromJSON('{"a":1,"A":2}').a }}
        run: |
          for name in P01_negzero_format P02_negzero_bare P03_negzero_dot P04_negzero_tojson \
                      P10_1e15 P11_2p53 P12_precision P13_1e18 P14_small \
                      P20_longs P21_deseret P22_dotless P23_eszett P24_sigma P25_kelvin \
                      P30_infinity_lower P31_infinity_plus P32_infinity_exact \
                      P40_precedence P41_chain \
                      P50_env_exact P51_env_lower P52_env_mixed \
                      P60_fromjson_bool P61_fromjson_num \
                      P70_tojson_order P71_wildcard_order \
                      P80_case_collide P81_case_collide_read; do
            printf '%s=<<%s>>\n' "$name" "${!name}"
          done

      - name: hashFiles probes
        env:
          # rooting: test.txt exists at repo root
          H01_root_bare: ${{ hashFiles('test.txt') }}
          H02_root_glob: ${{ hashFiles('**/test.txt') }}
          # the repo contains directory-symlink -> directory and file-symlink -> file
          H03_all: ${{ hashFiles('**') }}
          H04_dot: ${{ hashFiles('.') }}
          H05_star: ${{ hashFiles('*') }}
          H06_dirsymlink: ${{ hashFiles('directory-symlink/**') }}
          H07_filesymlink: ${{ hashFiles('file-symlink') }}
          H08_follow: ${{ hashFiles('--follow-symbolic-links', 'directory-symlink/**') }}
          H09_padded: ${{ hashFiles('  test.txt  ') }}
          H10_missing: ${{ hashFiles('no-such-file-anywhere.txt') }}
        run: |
          for name in H01_root_bare H02_root_glob H03_all H04_dot H05_star \
                      H06_dirsymlink H07_filesymlink H08_follow H09_padded H10_missing; do
            printf '%s=<<%s>>\n' "$name" "${!name}"
          done
