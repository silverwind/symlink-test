name: maxparallel-probe

# Separate file: if `max-parallel: 0` fails workflow validation, only this workflow fails.

on:
  push:
    branches: [expr-probe]

jobs:
  zero:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 0
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - run: echo "zero n=${{ matrix.n }} start=$(date +%s)"
