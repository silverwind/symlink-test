name: pnpm-cache-repro

on:
  push:
  workflow_dispatch:

jobs:
  vm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pnpm-repro
    steps:
      - uses: actions/checkout@v6
      - run: npm i --prefix "$RUNNER_TEMP/pnpm" pnpm@12.4.1 && echo "$RUNNER_TEMP/pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-repro/pnpm-lock.yaml
      - run: ls -a node_modules 2>/dev/null || echo "no node_modules before make deps"
      - run: make deps
      - run: node -e 'require("semver"); console.log("semver resolves")'
  container:
    runs-on: ubuntu-latest
    container: node:24
    defaults:
      run:
        working-directory: pnpm-repro
    steps:
      - uses: actions/checkout@v6
      - run: npm i --prefix "$RUNNER_TEMP/pnpm" pnpm@12.4.1 && echo "$RUNNER_TEMP/pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-repro/pnpm-lock.yaml
      - run: ls -a node_modules 2>/dev/null || echo "no node_modules before make deps"
      - run: make deps
      - run: node -e 'require("semver"); console.log("semver resolves")'
