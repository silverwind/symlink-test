name: bool-probe-yes
on:
  workflow_dispatch:
    inputs:
      yesval:
        description: boolean default yes
        type: boolean
        default: yes
      onval:
        description: boolean default on
        type: boolean
        default: on

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: dump contexts
        env:
          INPUTS: ${{ toJSON(inputs) }}
          EVENT_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          echo "INPUTS=$INPUTS"
          echo "EVENT_INPUTS=$EVENT_INPUTS"
