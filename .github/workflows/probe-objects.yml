{
  "name": "probe-objects",
  "on": {
    "push": {
      "branches": [
        "matrix-names"
      ]
    }
  },
  "jobs": {
    "object_conflict": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "cfg": [
            {
              "a": 1,
              "b": 2
            }
          ],
          "include": [
            {
              "cfg": {
                "a": 2
              },
              "extra": "conflict"
            },
            {
              "cfg": {
                "c": 3
              },
              "extra": "disjoint"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "object_superset": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "cfg": [
            {
              "a": 1
            }
          ],
          "include": [
            {
              "cfg": {
                "a": 1,
                "b": 2
              },
              "extra": "superset"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "object_partial_context": {
      "name": "${{ format('partial:{0}:{1}:{2}', matrix.cfg.a, matrix.cfg.b, matrix.extra) }}",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "cfg": [
            {
              "a": 1,
              "b": 2
            }
          ],
          "include": [
            {
              "cfg": {
                "a": 1
              },
              "extra": "partial"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "array_match": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": [
            [
              1,
              2
            ]
          ],
          "include": [
            {
              "v": [
                1
              ],
              "extra": "prefix"
            },
            {
              "v": [
                1,
                3
              ],
              "extra": "conflict"
            },
            {
              "v": [
                2,
                1
              ],
              "extra": "reordered"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "array_object": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": [
            [
              {
                "a": 1,
                "b": 2
              },
              3
            ]
          ],
          "include": [
            {
              "v": [
                {
                  "a": 1
                },
                3
              ],
              "extra": "nested"
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "exclude_object": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "cfg": [
            {
              "a": 1,
              "b": 2
            },
            {
              "a": 3,
              "b": 4
            }
          ],
          "exclude": [
            {
              "cfg": {
                "a": 1
              }
            }
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    }
  }
}
