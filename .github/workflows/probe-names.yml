{
  "name": "probe-names",
  "on": {
    "push": {
      "branches": [
        "matrix-names"
      ]
    }
  },
  "jobs": {
    "whitespace": {
      "name": "   ",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": [
            "a"
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "literal": {
      "name": "${{ 'fixed' }}",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": [
            "a"
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "computed": {
      "name": "${{ format('{0}', 'fixed') }}",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": [
            "a"
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "empty_literal": {
      "name": "${{ '' }}",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": [
            "a"
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "empty_computed": {
      "name": "${{ format('{0}', '') }}",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": [
            "a"
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "whitespace_computed": {
      "name": "${{ format('{0}', '   ') }}",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": [
            "a"
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "matrix_literal": {
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": "${{ fromJSON('[\"\\u0024{{ github.ref_name }}\"]') }}"
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "name_from_matrix": {
      "name": "${{ matrix.v }}",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": "${{ fromJSON('[\"\\u0024{{ github.ref_name }}\"]') }}"
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "literal_long": {
      "name": "${{ 'LLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLL' }}",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": [
            "a"
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "computed_long": {
      "name": "${{ format('expr:{0}', matrix.v) }}",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": [
            "VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV"
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    },
    "plain_long": {
      "name": "BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB",
      "runs-on": "ubuntu-latest",
      "strategy": {
        "matrix": {
          "v": [
            "VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV"
          ]
        }
      },
      "steps": [
        {
          "run": "true"
        }
      ]
    }
  }
}
